name: Build and deploy DuettBackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: duettbackend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: >
          dotnet publish ./Duett.API/Duett.API.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duett-api
          path: ./publish
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: duett-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5371AE4DA1AD41C9AF5FD502FC07DDF1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7164A07E75AE467E8A5BE890012E34C8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96CA41E820FA4A749AAED14592778CD6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: DuettBackend
          slot-name: Production
          package: ./publish
