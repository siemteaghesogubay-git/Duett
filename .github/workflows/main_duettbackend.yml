name: Build and deploy DuettBackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: duettbackend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: >
          dotnet publish ./Duett.API/Duett.API.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./publish

      - name: Check package size
        shell: pwsh
        run: |
          $files = Get-ChildItem ./publish -Recurse -File
          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Published size: {0:N2} MB" -f ($totalBytes / 1MB))

          $files |
            Sort-Object Length -Descending |
            Select-Object -First 15 FullName,
              @{Name="MB"; Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duett-api
          path: ./publish
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: duett-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9191D6B2465E4542AEFC3A4697928A5B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_836F7974E19F4DE699D3079836CC8703 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_528CAA9444AB413FBDB2318636C78325 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: DuettBackend
          slot-name: Production
          package: ./publish
